name: Stage historical semiconductor report sources
on:
  push:
    branches: [review/semiconductor-bilingual-report-20261104]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: semiconductor-original-report-assets
          path: |
            report/main.tex
            report/report.pdf
            report/figures/*.png
          retention-days: 7
