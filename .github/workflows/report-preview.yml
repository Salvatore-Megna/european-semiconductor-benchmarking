name: Preview bilingual semiconductor report

on:
  push:
    branches: [review/semiconductor-bilingual-report-20261104]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install plotting and PDF verifier
        run: python -m pip install 'Pillow>=10,<13' 'pymupdf>=1.24,<2'
      - name: Translate chart labels while preserving plotted values
        run: python report/en/translate_charts.py
      - name: Compile English LaTeX report
        uses: xu-cheng/latex-action@v4
        with:
          root_file: main.tex
          working_directory: report/en
      - name: Validate report contents and prepare approval copy
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import pymupdf

          old = Path("report/main.tex").read_text(encoding="utf-8")
          new = Path("report/en/main.tex").read_text(encoding="utf-8")
          def table_nums(tex):
              return [re.findall(r"(?<![A-Za-z])[-+]?\d+(?:,\d+)?", table)
                      for table in re.findall(r"\\begin\{table\}([\s\S]*?)\\end\{table\}", tex)]
          assert old.count(r"\begin{table}") == new.count(r"\begin{table}") == 4
          assert old.count(r"\begin{figure}") == new.count(r"\begin{figure}") == 4
          assert table_nums(old) == table_nums(new), "Original table values changed"
          with pymupdf.open("report/report.pdf") as it, pymupdf.open("report/en/main.pdf") as en:
              print(f"Page count: Italian {len(it)}, English {len(en)}")
              assert len(it) == 9
              assert all(abs(p.rect.width-595.276)<1 and abs(p.rect.height-841.89)<1 for p in en)
              text = "\n".join(p.get_text() for p in en)
              for key in ("Competitive positioning", "Benchmarking evidence",
                          "PCA", "Conclusions", "References"):
                  assert key in text, key
              assert len(en) == len(it), "English report pagination must match"
          print("All original numerical tables, figures and pages verified.")
          PY
          cp report/en/main.pdf report/en/report.pdf
      - name: Upload original and translated reports for user review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semiconductor-bilingual-review
          path: |
            report/report.pdf
            report/en/main.pdf
            report/en/report.pdf
            report/en/figures/*.png
          retention-days: 7
      - name: Record verified English report on review branch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add report/en/report.pdf report/en/figures/
          if ! git diff --cached --quiet; then
            git commit -m "docs: save verified English semiconductor report [skip ci]"
            git push origin HEAD:review/semiconductor-bilingual-report-20261104
          fi
